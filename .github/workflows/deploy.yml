name: Deploy production

# Deploy production dijalankan dari GitHub Actions, bukan dari Git integration Vercel.
# Alasannya: di paket Hobby, Vercel hanya mau membangun commit yang author-nya
# pemilik akun. Dengan Actions, siapa pun di tim boleh commit, deploy tetap jalan.
#
# Secrets yang dibutuhkan (Settings > Secrets and variables > Actions):
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cek secrets Vercel
        run: |
          missing=""
          [ -z "$VERCEL_TOKEN" ] && missing="$missing VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ] && missing="$missing VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Secret belum diisi:$missing. Lihat README bagian Deploy lewat GitHub Actions."
            exit 1
          fi
          echo "Secrets lengkap."

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull environment production
        run: vercel pull --yes --environment=production

      - name: Build
        run: vercel build --prod

      - name: Deploy ke production
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"

      - name: Ringkasan
        run: |
          {
            echo "### Production deploy"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Author: ${{ github.actor }}"
            echo "- URL: ${{ steps.deploy.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
